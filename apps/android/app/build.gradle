plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.dystos.app'
    compileSdk Integer.parseInt(providers.gradleProperty('dystos.compileSdk').get())

    defaultConfig {
        applicationId 'dev.dystos.app'
        minSdk Integer.parseInt(providers.gradleProperty('dystos.minSdk').get())
        targetSdk Integer.parseInt(providers.gradleProperty('dystos.targetSdk').get())
        versionCode 1
        versionName '0.1.0-alpha'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Necessaire si le compilateur embarque utilise des API Java recentes.
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    sourceSets {
        main {
            assets.srcDirs += ['src/main/assets']
        }
    }
}

dependencies {
    // Aucune dependance Play Services : le principe de souverainete l'interdit.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.activity:activity:1.9.3'

    // Presentation : ViewModel et LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'

    testImplementation 'junit:junit:4.13.2'
}